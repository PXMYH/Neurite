<div class="submenu">

    <!-- Open…, Save to…, Clear, Screenshot and Record used to head this panel. They are
         rows of the menu itself now (`dropdown.html`): they are commands, and a command
         that needs a panel opened first is a command two clicks deep. The hidden file
         input behind Open went with them, because it has to stay rendered and this panel
         does not.

         The "Autosaving" status went with nothing -- it was deleted. It described a
         behaviour that has no switch: `#startAutosave` runs on a timer from `init` and
         nothing turns it off, so the line spent a row of the panel restating a state
         that is never anything else. A status that cannot change is not a status.

         What is left is everything that operates on storage the browser evicts on its
         own terms -- the saves themselves, and the coordinates. -->

    <div id="saved-networks-container" class="scrollable-list"></div>


    <div class="top-section">
        <div id="savedCoordinatesContainerTop" class="saved-coordinates-container"></div>
    </div>

    <div id="savedCoordinatesContainer" class="saved-coordinates-container"></div>

    <div class="bottom-section">
        <div id="savedCoordinatesContainerBottom" class="saved-coordinates-container"></div>
        <div class="buttons-right">
            <a id="saveCoordinatesBtn">Store Coordinates</a>
            <a id="deleteCoordinatesBtn">Delete Coordinates</a>
        </div>
    </div>

    <div id="coordinates" class="coordinates-container">
        <div class="coordinate-field">
            <span>pan</span>
            <input id="pan" type="text" value="0+0i" style="background:none; border:none;" size="28" />
        </div>
        <div class="coordinate-field">
            <span>zoom</span>
            <input id="zoom" type="text" value="1" style="background:none; border:none;" size="25" />
        </div>
    </div>
</div>
