    <!-- The editor and nothing above it. There was a strip of five icons here: a
         dropdown to switch Archive, `+` to create one, trash to delete one, a gear
         for the Zettelkasten settings, and Search. As bare icons directly above a
         text editor they all read as note-level -- a `+` beside an editor looks like
         "add a note", which is what the tool bar's Note icon does instead.

         The settings are in the Settings tab and Search is in the tool bar, where a
         control over every Node on the canvas belongs. The Archive controls are gone
         until they come back designed -- see issue #64, which also records what an
         Archive is. `switchPane` still runs when a Node in another Archive is
         clicked, so a saved graph with several of them stays usable; there is just
         no way to add or delete one by hand. -->
    <div id="zetPaneContainer" class="zet-pane-container">
        <div id="zetPaneContent" class="zet-pane-content"></div>
    </div>

    <!-- The prompt form was here, under the editor, and it is in the Ai tab now: it is
         the one thing in this file the reader still needs, and this tab has no tablink
         any more. Nothing in the move is conditional on where the markup sits -- the
         handlers bind by id, and tab HTML lands before the scripts that bind it.

         What is left in here is the editor the app cannot boot without. Issue #65. -->
</div>
