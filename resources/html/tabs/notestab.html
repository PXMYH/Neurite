<div class="submenu">
    <div id="zetHorizDragHandle" class="zet-drag-handle-horiz"></div>
    <div id="zetVertDragHandle" class="zet-drag-handle-vert"></div>
    <!-- The editor and nothing above it. There was a strip of five icons here: a
         dropdown to switch Archive, `+` to create one, trash to delete one, a gear
         for the Zettelkasten settings, and Search. As bare icons directly above a
         text editor they all read as note-level -- a `+` beside an editor looks like
         "add a note", which is what the tool bar's Note icon does instead.

         The settings are in the Settings tab and Search is in the tool bar, where a
         control over every Node on the canvas belongs. The Archive controls are gone
         until they come back designed -- see issue #64, which also records what an
         Archive is. `switchPane` still runs when a Node in another Archive is
         clicked, so a saved graph with several of them stays usable; there is just
         no way to add or delete one by hand. -->
    <div id="zetPaneContainer" class="zet-pane-container">
        <div id="zetPaneContent" class="zet-pane-content"></div>
    </div>
    <form id="prompt-form" onsubmit="sendMessage(event);">
        <!-- Second Row: Prompt Form -->
        <div style="display: flex; width: 100%; padding-top: 12px;">

            <!-- Textarea for main prompt -->
            <textarea id="prompt" class="custom-scrollbar" rows="1" oninput="autoGrow(event);" placeholder="Enter prompt..." required></textarea>

            <!-- Status icons positioned similarly to function prompt -->
            <div class="status-icons-container" style="position: relative; right: 45px; top: 6px;">
                <!-- Status icons (Loader and Error) -->
                <div class="loader" id="aiLoadingIcon" style="display:none;"></div>
                <div class="error-icon-css" id="aiErrorIcon" style="display:none;">
                    <div class="error-x-mark">
                        <span class="error-x-mark-left"></span>
                        <span class="error-x-mark-right"></span>
                    </div>
                </div>
            </div>

            <!-- Run button (Play icon) -->
            <button type="submit" title="Submit prompt">
                <svg width="18" height="18">
                    <use xlink:href="#play-icon"></use>
                </svg>
            </button>

            <!-- Regenerate button (Refresh icon) -->
            <button id="regen-button" type="button" title="Refresh/Halt response">
                <svg width="18" height="18">
                    <use xlink:href="#refresh-icon"></use>
                </svg>
            </button>
        </div>
    </form>
</div>
