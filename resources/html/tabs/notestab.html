<div class="submenu">
    <div id="zetHorizDragHandle" class="zet-drag-handle-horiz"></div>
    <div id="zetVertDragHandle" class="zet-drag-handle-vert"></div>
    <!-- The Archive controls (#64), above the text they act on. There was a strip of
         five bare icons here -- an Archive dropdown, `+`, trash, a gear, and Search --
         and directly above a text editor they read as acts on a note: a `+` beside an
         editor looks like "add a note", which is the tool bar's Note icon. So every
         control here is text, and every one names the Archive: the select, which says
         which Archive is shown and how many notes it holds, and the three buttons.

         The shown Archive is where new notes are written (the tool bar's Note, an AI
         answer with no node to go to), which is why the HUD names it too when there is
         more than one. The settings are in the Settings tab and Search is in the tool
         bar. `ZetPanes` wires this subtree. -->
    <div class="archive-bar">
        <!-- The tooltip on the select, not its wrapper: `CustomDropdown.carryAccessibility`
             copies a select's `title` and `aria-describedby` to the control that stands in
             for it, and nothing reads a wrapper's. -->
        <div class="dropdown-container archive-choice">
            <select id="archiveSelect" class="model-selector custom-select ignoreSetup" aria-label="Archive"
                    title="The Archive shown here, which is where new notes are written."
                    aria-describedby="archiveAbout"></select>
        </div>
        <div class="archive-actions">
            <button type="button" class="key-button" id="archiveNew"
                    title="Start an empty Archive, and show it here.">New Archive</button>
            <button type="button" class="key-button" id="archiveRename"
                    title="Give the Archive shown here another name.">Rename Archive…</button>
            <button type="button" class="key-button" id="archiveDelete"
                    title="Delete the Archive shown here, and the notes written in it.">Delete Archive…</button>
        </div>
        <!-- What an Archive is, on screen: elsewhere the word means put away, and a new,
             empty one still shows every note on the canvas. -->
        <p class="archive-about" id="archiveAbout">Each Archive is a separate text for the same canvas. A Title names one note across all of them.</p>
    </div>
    <div id="zetPaneContainer" class="zet-pane-container">
        <div id="zetPaneContent" class="zet-pane-content"></div>
        <!-- Why a Title line in the shown Archive makes no note: its Title is taken. In the
             page from the start and empty when there is nothing to say, not `hidden`: a
             screen reader can pass over a live region that appears with its text. -->
        <p class="archive-status" id="archiveStatus" role="status"></p>
    </div>

    <!-- The prompt form was here, under the editor, and it is in the Ai tab now, next
         to the model it talks to. Nothing in the move is conditional on where the
         markup sits -- the handlers bind by id, and tab HTML lands before the scripts
         that bind it.

         What is left in here is the editor, which the menu's Notes row opens and the
         app cannot boot without. Issue #65. -->
</div>
