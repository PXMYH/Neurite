
<!-- Canvas chrome, as floating islands rather than as bars.

     The root spans the viewport only so its children can be placed against any
     edge; it is `pointer-events: none`, so the canvas behind it is untouched
     except where an island actually sits. What came before was a full-width
     strip pinned to the top, which owned a band of the screen it had no content
     for and needed a gesture guard across its whole empty middle to stop drags
     on it from panning the graph.

     Two islands: the tool pill, centred at the top, and the menu, bottom-left. -->

<div class="dropdown" id="dropdowndiv">

    <!-- The tool pill. The four creators used to sit in a popover behind a plus,
         which cost a tap to reach any of them and hid what the app could make.
         Four is few enough to lay out flat, so the plus is gone and every tool
         is one press.

         Each row is still the same `.panel-icon <type>-icon` element it always
         was: `handledrop.js` reads `classList[1]` for the icon name and binds
         click and drag-out-to-place by the `.panel-icon` class, so both keep
         working with no change there.

         `.node-panel` is also the element `functioncallingpanel.js` hangs its
         event guards on, so the class stays even though the panel it was named
         for is long gone -- it is the tool group inside the pill now. -->
    <div class="tool-bar" role="toolbar" aria-label="Graph tools">
        <div class="node-panel">
            <!-- Icon only, and the name arrives on hover. Five names spelled out
                 across the top of the canvas made a 577px caption strip -- wider
                 than a phone -- out of five Lucide glyphs that read at a glance,
                 and what the labels were really covering for was the second the
                 browser makes you wait for a `title`. That is fixed at the source
                 now: `data-tooltip` is served by hovertooltip.js, instantly and in
                 the chrome's own box. `title` is gone rather than kept as a
                 fallback, or the two would stack.

                 `aria-label` is the name for a screen reader, which the label text
                 used to be; the tooltip is the sighted half of the same thing, so
                 it leads with that name, then what a click does, then the drag,
                 then the canvas shortcut.

                 AI is last of the four. It was put there so that switching AI features
                 off shortened the pill rather than leaving a hole; the switch is gone
                 (#81), and AI is always on. -->
            <div class="panel-icon note-icon node-add-item" role="button" tabindex="0"
                 aria-label="New note"
                 data-tooltip="New note (1): click, or drag out to place it. Shift + Double Click on the canvas does the same.">
                <svg aria-hidden="true">
                    <use xlink:href="#note-icon-symbol"></use>
                </svg>
                <span class="tool-key" aria-hidden="true">1</span>
            </div>
            <div class="panel-icon link-icon node-add-item" role="button" tabindex="0"
                 aria-label="Link node"
                 data-tooltip="Link node (2): click to enter a URL, or drag out to place one.">
                <svg aria-hidden="true">
                    <use xlink:href="#link-icon-symbol"></use>
                </svg>
                <span class="tool-key" aria-hidden="true">2</span>
            </div>
            <div class="panel-icon edges-icon node-add-item" role="button" tabindex="0"
                 aria-label="File tree"
                 data-tooltip="File tree (3): click to pick a folder, or drag out to place a Node.">
                <svg aria-hidden="true">
                    <use xlink:href="#edges-icon-symbol"></use>
                </svg>
                <span class="tool-key" aria-hidden="true">3</span>
            </div>
            <div class="panel-icon ai-icon node-add-item" role="button" tabindex="0"
                 aria-label="AI note"
                 data-tooltip="AI note (4): click for its settings, or drag out to place one. Alt/Option + Double Click on the canvas places one directly.">
                <svg aria-hidden="true">
                    <use xlink:href="#ai-icon-symbol"></use>
                </svg>
                <span class="tool-key" aria-hidden="true">4</span>
            </div>
        </div>

        <div class="tool-bar-divider" aria-hidden="true"></div>

        <!-- Search came from the Notes pane header, where it sat directly above a
             text editor and so read as "search this document". It never was that:
             `performZettelkastenSearch` walks `Graph.forEachNode`, highlights the
             Nodes that match anywhere on the canvas, and flies the camera to the
             one you click. It is a Graph control, so it belongs on the Graph.

             A real <button>, unlike the four creators, which have to be divs
             because a draggable <button> does not fire `dragstart` everywhere.
             Nothing is dragged out to search, so this gets Tab and Enter for
             free -- and it must not take `.panel-icon`, or `handledrop.js` would
             make it draggable and drop a Node type that does not exist.

             After the creators, not before them, because the digit shortcuts 1-4
             are the creators' positions in the pill and the tooltips promise it.

             Connect is the Shift gesture made visible (#50): holding Shift lights
             it, and a click keeps the mode on without the key -- which is also the
             only way to connect two Nodes on a screen with no keyboard. Shift used
             to light the File tree tool, whose glyph was a three-node graph until
             #52 made it a folder, so the mode's one tell pointed at the wrong tool.
             `aria-pressed` is the mode itself, written by `NodeMode.switch`. -->
        <button id="connectTool" class="tool-bar-action" aria-label="Connect Nodes" aria-pressed="false"
                data-tooltip="Connect Nodes (hold Shift): click one Node, then another, to join them. Click here to keep it on; Esc turns it off.">
            <svg aria-hidden="true">
                <use xlink:href="#connect-icon-symbol"></use>
            </svg>
        </button>
        <button id="nodeSearchButton" class="tool-bar-action" aria-label="Search Nodes"
                data-tooltip="Search Nodes: highlights every match on the canvas.">
            <svg aria-hidden="true">
                <use xlink:href="#searchSVG"></use>
            </svg>
        </button>
        <!-- A Graph control like Search: it reads every note (#72). -->
        <button id="proposeEdgesButton" class="tool-bar-action" aria-label="Propose Edges"
                data-tooltip="Propose Edges: pairs of notes that could be linked, and why, notes with no Edge first.">
            <svg aria-hidden="true">
                <use xlink:href="#proposals-icon-symbol"></use>
            </svg>
        </button>
        <!-- Clear came here from the menu (#78). It acts on the whole Graph as Search and
             Propose do, and it is what a reader reaches for between one graph and the
             next. It is the same control as it was: `savenet.js` binds it by id, asks
             before it acts, and saves this graph before it empties the canvas. Last in
             the group, so it is never the button between two others. -->
        <button id="clear-button" class="tool-bar-action" aria-label="Clear"
                data-tooltip="Clear: put this graph away and start an empty one. It asks first, and this graph is saved before the canvas is cleared.">
            <svg aria-hidden="true">
                <use xlink:href="#eraser-icon"></use>
            </svg>
        </button>
    </div>

    <!-- Top-left, where a hamburger is looked for. The reasoning for bottom-left was
         that settings are reached for least, and it stopped holding once Open and
         Save to became rows of this menu: they are the two controls a graph's
         survival depends on, and a control you need before you lose something cannot
         be in the corner you learn last. `styles.css:1148` carries the same note.

         `aria-label` as well as the tooltip, because `data-tooltip` is invisible to
         a screen reader where the `title` it replaced was not. Chrome's AX tree had
         this island unnamed the moment the attribute changed.

         The tooltip names the commands first, in the order the rows are in. It named
         only the panels, which was the whole menu when it was a strip of tabs; three
         commands sit above them now. It names every panel, notes and help included:
         it left notes out while that tab had no row, and it is first again (#65).

         A `<button>`, because a div was the whole keyboard surface of the menu and
         there was none. Measured before: Tab from the top of the document made six
         stops -- the four pill tools, `#nodeSearchButton`, `#ai-features-enabled` --
         and wrapped, so nine rows, five panels, every API key, Open, Save to,
         Screenshot, Record and the function console had no keyboard route at all.
         The div read `tabIndex: -1`, `focus()` on it was a no-op, and its AX role was
         `generic` with the name "Menu" -- a named nothing, with no state and no way
         in. As a button it is the 7th Tab stop, Enter and Space open it, the global
         `button:focus-visible` ring applies, and `HoverTooltip`'s `focus` path names
         it on arrival, which a non-focusable div could never reach.

         `aria-expanded` because the name alone does not say whether the menu is
         open, and the two `classList.toggle`s in `dropdown.js` are the only writes to
         that state in the tree. -->
    <button type="button" class="menu-button" aria-label="Menu" aria-expanded="false"
            data-tooltip="Menu: import a graph, save it to disk, share the screen, open Settings with the notes and AI, and Help">
        <!-- A span, not the div it was: a `<button>` takes phrasing content, and the
             three bars are `position: absolute`, so the box is identical either way. -->
        <span class="menu-icon" id="menu-icon"></span>
    </button>

    <!-- The menu is a column of rows, and one row at a time is a whole panel. It was
         a strip of five chips over the panel they switched: five 14px labels laid
         side by side in a box that then had to be as wide as the widest of them,
         with the active chip the only clue which panel you were looking at.

         A column reads top to bottom the way a menu does, each row is a full-width
         target rather than a chip, and the panel that opens replaces the column
         instead of sitting under it -- so the width is the panel's own and the
         reader is never looking at two levels of the same menu at once. -->
    <div class="dropdown-content">
        <div class="menu-panel">
            <nav class="menu-list" id="menuList" aria-label="Menu">
                <!-- The commands, above the panels and separated from them, because they
                     are the only rows that do something rather than go somewhere:
                     no chevron, because there is no level to descend to. The menu does
                     not close around them either -- the only writes to the `open` class
                     in the tree are the two toggles in the hamburger's own handler, so
                     Share screen photographs the screen with this menu over it. That was
                     equally true when it lived inside the Saves panel, so it is not new
                     here; it is left as it was rather than described as something it is
                     not.

                     Import and Save to… are the whole life of a graph read top to
                     bottom: bring one in, send one out. And they are the *only* way a
                     graph is kept or restored: there is no list of graphs anywhere in
                     this interface. A graph lives on the canvas, and its durable form is
                     a `.neurite` file on disk -- which is the one copy no browser can
                     evict, and the one a reader can move, back up and read the size of.

                     Autosave still runs underneath, and it still reopens the last graph
                     on a refresh, so a reload or a crash costs nothing. What it is not is
                     a filing cabinet: it holds the graph you are in, and Save to… is what
                     keeps a graph you want to come back to.

                     Fewer rows than there were (#78): Clear is in the tool pill now, with
                     the other commands that act on the whole Graph; Record is gone; and
                     the Mac app's Check for updates is in Settings, where the Settings
                     row carries the dot the menu button does while one is ready.

                     `savenet.js`, `zetimport.ts`, `neuralapi.js` and `handledrop.js` bind
                     by id, so moving the markup changes no wiring. The label is its own
                     span for the same reason as before: `savenet.js` writes the words,
                     and writing to the button would take the icon with them. -->

                <!-- One row for both ways a graph comes in (#78). They were two rows, Open…
                     and Import notes…, and read as one command twice -- but they are not one:
                     the first reads a `.neurite` file, the only way back to a graph Save to…
                     wrote, and the second a folder of Markdown notes. No browser dialog offers
                     both: a file input picks files or, with `webkitdirectory`, folders, never
                     either. So the row opens the two sources under itself, as a submenu does,
                     and each keeps the id its handler binds -- `savenet.js` and `zetimport.ts`
                     need no change. `aria-expanded` is the state the chevron draws; the
                     handler is in `dropdown.js`. -->
                <button type="button" class="menu-row menu-disclosure" id="import-button"
                        aria-expanded="false" aria-controls="import-sources"
                        title="Bring a graph in: a Neurite file, or a folder of Markdown notes.">
                    <svg class="menu-row-icon" aria-hidden="true"><use xlink:href="#import-icon"></use></svg>
                    <span class="menu-row-label">Import</span>
                    <svg class="menu-row-chevron" aria-hidden="true"><use xlink:href="#chevron-down-icon"></use></svg>
                </button>
                <div class="menu-sources" id="import-sources" role="group" aria-label="Import from" hidden>
                    <button type="button" class="menu-row menu-source" id="open-file-button"
                            title="Open a .neurite file, as Save to… writes. It is added as a new save, so nothing on screen is overwritten.">
                        <span class="menu-row-label">Neurite file…</span>
                    </button>
                    <!-- A folder of Markdown notes, read into a graph (#71). -->
                    <button type="button" class="menu-row menu-source" id="import-notes-button"
                            title="Read a folder of Markdown notes into a graph: each file whose frontmatter names its type becomes a note, each folder an Archive, and the notes' own [[links]] become edges. The folder is only read.">
                        <span class="menu-row-label">Folder of notes…</span>
                    </button>
                </div>
                <!-- The title is written by `savenet.js`: what this does depends on
                     whether the browser can hold a file open. -->
                <button type="button" class="menu-row" id="disk-file-button" aria-describedby="save-note">
                    <svg class="menu-row-icon" aria-hidden="true"><use xlink:href="#download-icon"></use></svg>
                    <span class="menu-row-label">Save to…</span>
                </button>
                <!-- How safe the Graph is, under the row that makes it safer (#59, #11): when it
                     was last saved to a file, whether this browser may clear its own copy, and
                     why nothing is being saved when that is the case. The file is the copy that
                     survives, so its age is the one fact here that changes what a reader should
                     do. Written by `savenet.js`. -->
                <p class="menu-note" id="save-note"></p>
                <!-- Named for what the browser asks for first (#78): its own dialog to share a
                     screen, a window or a tab. What lands on the canvas is one still of it, as
                     an image node -- `Recorder.captureScreenToImage`, bound in `neuralapi.js`. -->
                <button type="button" class="menu-row" id="screenshotButton"
                        title="Share a screen, a window or a tab, and drop a still of it on the canvas as an image node.">
                    <svg class="menu-row-icon" aria-hidden="true"><use xlink:href="#screen-share-icon"></use></svg>
                    <span class="menu-row-label">Share screen</span>
                </button>

                <div class="menu-separator" role="separator"></div>

                <!-- Settings opens the Settings modal (#82), as Notion's settings open over the
                     page: a dialog with its sections in a sidebar. Notes and Ai are sections of
                     it now, beside the theme and the rest, so the menu keeps what is not a
                     setting -- the commands above, and Help. It opens a window rather than a
                     level of the menu, so it carries no chevron, and `aria-haspopup="dialog"`
                     says what it opens. `settingsmodal.js` binds it. -->
                <button type="button" class="menu-row" id="settings-button" aria-haspopup="dialog"
                        title="Notes, Ai, the theme, saved views, the Fractal, editing and data, in one window.">
                    <svg class="menu-row-icon" aria-hidden="true"><use xlink:href="#gear-icon"></use></svg>
                    <span class="menu-row-label">Settings</span>
                </button>

                <!-- Help is the one row left that opens a panel of the menu, so it carries the
                     chevron. `openTab` shows the panel, and the panel view is what
                     `MainMenu.showDetail` switches to; the `tablink` class stays because
                     `openTab` clears `activeTab` across it.

                     A `title` rather than the `data-tooltip` the pill and the menu button use:
                     that exists because a name arriving a second late in an OS box over the
                     canvas reads as an accident, and none of that applies to a row of a menu
                     already open and already labelled.

                     No `aria-haspopup`: ARIA defines `true` as `menu`, and Chrome's AX tree
                     reported `hasPopup: "menu"` on these rows when they had it -- a menu widget
                     with arrow-key semantics, where what opens is a panel with a Back button.
                     Not `aria-expanded` either: opening the panel hides the whole list, so the
                     row's own state is never observable. The marker is in the name instead,
                     where it cannot go stale: `.visually-hidden` makes it "Help panel". A
                     *sibling* of `.menu-row-label`, never a child of it, because
                     `MainMenu.showDetail` sets the panel heading from `label.textContent`.

                     `type="button"`, as every row carries: a button with no `type` is a submit
                     button, which would reload the page the day this nav sits in a form. -->
                <button type="button" class="menu-row tablink" onclick="openTab('tab3', this)"
                        title="Every mouse and keyboard control, in one list.">
                    <svg class="menu-row-icon" aria-hidden="true"><use xlink:href="#question-mark"></use></svg>
                    <span class="menu-row-label">Help</span>
                    <span class="visually-hidden"> panel</span>
                    <svg class="menu-row-chevron" aria-hidden="true"><use xlink:href="#caret-right-icon"></use></svg>
                </button>
            </nav>

            <!-- One panel at a time, with the way back at the top of it. The heading
                 is written by `MainMenu.showDetail` from the row's own label, so a
                 renamed row cannot disagree with the heading it opens.

                 The name is built out of the button's own contents, not declared. An
                 `aria-label="Back to the menu"` here overrode the subtree it labels,
                 and this subtree is the only place the open panel is named: a screen
                 reader was read "Back to the menu, button" over a panel of fractal
                 sliders with nothing anywhere saying Fractal. A hidden "Back to" in
                 front of the heading makes the name "Back to Fractal" and tracks
                 whatever `showDetail` writes.

                 Not a heading role on the title: it is inside a button, where a
                 heading is not exposed. The button's name is what carries the panel
                 name, which is what a reader landing here by keyboard is read. -->
            <div class="menu-detail" id="menuDetail">
                <button type="button" class="menu-back" id="menuBackButton">
                    <svg class="menu-row-icon" aria-hidden="true"><use xlink:href="#caret-left-icon"></use></svg>
                    <span class="visually-hidden">Back to</span>
                    <span class="menu-row-label" id="menuDetailTitle">Menu</span>
                </button>

                <!-- Help's panel. Notes, Ai and Settings were panels here too, until #82 made
                     them sections of the Settings modal below. -->
                <div id="tab3" class="tabcontent">
                    <!-- Tab 3 content will be loaded here -->
                </div>
            </div>

            <!-- The file input behind Import's Neurite file…, out here and not beside
                 the row: `display: none` is what `.menu-list` hides with, and Safari will
                 not open a file dialog for an input it treats as unrendered. The row is
                 only reachable from the list, but the input is reachable from anywhere
                 `savenet.js` decides to click it. -->
            <input type="file" id="open-file-input" class="visually-hidden"
                   accept=".neurite,.txt,application/octet-stream" />
            <!-- The folder behind Import's Folder of notes…, out here for the same reason. -->
            <input type="file" id="import-notes-input" class="visually-hidden" webkitdirectory multiple />
        </div>
    </div>
    <!-- Settings (#82), as a modal the way Notion's settings are: a large dialog over the page,
         its pages listed in a sidebar on the left and the chosen one on the right, opened from
         the menu's Settings row. A click outside it, the close button, or Esc closes it;
         `settingsmodal.js` runs it, and `panels.css` draws it.

         A child of `.dropdown` like the islands, so it gets the chrome's guard against canvas
         gestures (a wheel over it scrolls it rather than zooming the Graph) and sits under
         `#customModal`, which the controls in it open -- Adjust…, the Ollama and Vector-DB
         windows, every `window.confirm`. Under `#invert-filter` too, so Paper turns it light
         with everything else, which the theme cards' pictures count on.

         Not a native `<dialog>`: `showModal()` draws in the top layer, above every z-index,
         so the windows its own controls open would land behind it, and the page's filter
         would not reach it. -->
    <div class="settings-modal" id="settingsModal" hidden>
        <div class="settings-backdrop" id="settingsBackdrop"></div>
        <div class="settings-dialog" role="dialog" aria-modal="true" aria-label="Settings" tabindex="-1">
            <!-- The pages, in groups as Notion's are: the two that write the Graph, the three
                 that change what is on screen, and the rest. Not "Workspace" or "Appearance",
                 which CONTEXT.md keeps from naming the Graph and the Theme. `data-page` is
                 what `settingsmodal.js` shows: Notes and Ai are the old panels whole, the
                 others the sections of the Settings markup that name that page. Updates is
                 the Mac app's only (`appupdate.js`). -->
            <nav class="settings-nav" aria-label="Settings pages">
                <div class="settings-nav-group">
                    <div class="settings-nav-heading">Writing</div>
                    <button type="button" class="settings-nav-item" data-page="notes">
                        <svg aria-hidden="true"><use xlink:href="#file-text-icon"></use></svg>
                        <span>Notes</span>
                    </button>
                    <button type="button" class="settings-nav-item" data-page="ai">
                        <svg aria-hidden="true"><use xlink:href="#ai-icon-symbol"></use></svg>
                        <span>Ai</span>
                    </button>
                </div>
                <div class="settings-nav-group">
                    <div class="settings-nav-heading">View</div>
                    <button type="button" class="settings-nav-item" data-page="theme">
                        <svg aria-hidden="true"><use xlink:href="#palette-icon"></use></svg>
                        <span>Theme</span>
                    </button>
                    <button type="button" class="settings-nav-item" data-page="saved-views">
                        <svg aria-hidden="true"><use xlink:href="#eyeball-symbol"></use></svg>
                        <span>Saved views</span>
                    </button>
                    <button type="button" class="settings-nav-item" data-page="fractal">
                        <svg aria-hidden="true"><use xlink:href="#fractal-icon"></use></svg>
                        <span>Fractal</span>
                    </button>
                </div>
                <div class="settings-nav-group">
                    <div class="settings-nav-heading">General</div>
                    <button type="button" class="settings-nav-item" data-page="editing">
                        <svg aria-hidden="true"><use xlink:href="#keyboard-icon"></use></svg>
                        <span>Editing</span>
                    </button>
                    <button type="button" class="settings-nav-item" data-page="data">
                        <svg aria-hidden="true"><use xlink:href="#database-icon"></use></svg>
                        <span>Data</span>
                    </button>
                    <button type="button" class="settings-nav-item" data-page="updates" id="settingsNavUpdates" hidden>
                        <svg aria-hidden="true"><use xlink:href="#refresh-icon"></use></svg>
                        <span>Updates</span>
                    </button>
                </div>
            </nav>

            <div class="settings-content">
                <div class="settings-content-head">
                    <h2 class="settings-page-title" id="settingsPageTitle">Settings</h2>
                    <button type="button" class="settings-close" id="settingsClose" aria-label="Close settings">
                        <svg aria-hidden="true"><use xlink:href="#close-icon"></use></svg>
                    </button>
                </div>
                <!-- `menu-detail` as well: it is the class every panel's styles are scoped by
                     (`panels.css`), and the panels' contents moved here whole. -->
                <div class="settings-content-body menu-detail" id="settingsBody">
                    <!-- The Notes page: the editor's designed home (issue #65). The div and its
                         `PageLoad.tabs` entry would be load-bearing even unseen, because the
                         app reads what loads into it and would throw without it -- `App.init`
                         builds `ZetPanes` from `#zetPaneContainer`. It also keeps
                         text-to-graph sync alive: an AI answer with no target node is streamed
                         into that editor, and the sync pass turns it into nodes. -->
                    <div id="tab1" class="tabcontent">
                        <!-- Tab 1 content will be loaded here -->
                    </div>
                    <div id="tab4" class="tabcontent">
                        <!-- Tab 4 content will be loaded here -->
                    </div>
                    <div id="tab5" class="tabcontent">
                        <!-- Tab 5 content will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
