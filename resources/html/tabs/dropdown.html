
<!-- Canvas chrome, as floating islands rather than as bars.

     The root spans the viewport only so its children can be placed against any
     edge; it is `pointer-events: none`, so the canvas behind it is untouched
     except where an island actually sits. What came before was a full-width
     strip pinned to the top, which owned a band of the screen it had no content
     for and needed a gesture guard across its whole empty middle to stop drags
     on it from panning the graph.

     Two islands: the tool pill, centred at the top, and the menu, bottom-left. -->

<div class="dropdown" id="dropdowndiv">

    <!-- The tool pill. The four creators used to sit in a popover behind a plus,
         which cost a tap to reach any of them and hid what the app could make.
         Four is few enough to lay out flat, so the plus is gone and every tool
         is one press.

         Each row is still the same `.panel-icon <type>-icon` element it always
         was: `handledrop.js` reads `classList[1]` for the icon name and binds
         click and drag-out-to-place by the `.panel-icon` class, so both keep
         working with no change there.

         `.node-panel` is also the element `functioncallingpanel.js` hangs its
         event guards on, so the class stays even though the panel it was named
         for is long gone -- it is the tool group inside the pill now. -->
    <div class="tool-bar" role="toolbar" aria-label="Graph tools">
        <div class="node-panel">
            <!-- Every title says what a click does first, then the drag, then the
                 canvas shortcut. They used to name only the shortcut, so the icons
                 read as reminders for a gesture rather than as controls you press.

                 AI is last so that turning AI features off shortens the pill rather
                 than leaving a hole in the middle of it. -->
            <div class="panel-icon note-icon node-add-item" role="button" tabindex="0"
                 title="New note (1): click, or drag out to place it. Shift + Double Click on the canvas does the same.">
                <svg aria-hidden="true">
                    <use xlink:href="#note-icon-symbol"></use>
                </svg>
                <span>Note</span>
            </div>
            <div class="panel-icon link-icon node-add-item" role="button" tabindex="0"
                 title="Link node (2): click to enter a URL, or drag out to place one.">
                <svg aria-hidden="true">
                    <use xlink:href="#link-icon-symbol"></use>
                </svg>
                <span>Link</span>
            </div>
            <div class="panel-icon edges-icon node-add-item" role="button" tabindex="0"
                 title="File tree (3): click to pick a folder, or drag out to place a Node.">
                <svg aria-hidden="true">
                    <use xlink:href="#edges-icon-symbol"></use>
                </svg>
                <span>File tree</span>
            </div>
            <div class="panel-icon ai-icon node-add-item" role="button" tabindex="0"
                 title="AI note (4): click for its settings, or drag out to place one. Alt/Option + Double Click on the canvas places one directly.">
                <svg aria-hidden="true">
                    <use xlink:href="#ai-icon-symbol"></use>
                </svg>
                <span>AI note</span>
            </div>
        </div>

        <div class="tool-bar-divider" aria-hidden="true"></div>

        <!-- Search came from the Notes pane header, where it sat directly above a
             text editor and so read as "search this document". It never was that:
             `performZettelkastenSearch` walks `Graph.forEachNode`, highlights the
             Nodes that match anywhere on the canvas, and flies the camera to the
             one you click. It is a Graph control, so it belongs on the Graph.

             A real <button>, unlike the four creators, which have to be divs
             because a draggable <button> does not fire `dragstart` everywhere.
             Nothing is dragged out to search, so this gets Tab and Enter for
             free -- and it must not take `.panel-icon`, or `handledrop.js` would
             make it draggable and drop a Node type that does not exist.

             After the creators, not before them, because the digit shortcuts 1-4
             are the creators' positions in the pill and the titles promise it. -->
        <button id="nodeSearchButton" class="tool-bar-action"
                title="Search Nodes: highlights every match on the canvas.">
            <svg aria-hidden="true">
                <use xlink:href="#searchSVG"></use>
            </svg>
            <span>Search</span>
        </button>

        <div class="tool-bar-divider" aria-hidden="true"></div>

        <!-- The switch sits beside the AI note tool it governs, and outside the
             menu because the Ai tab is one of the things it hides. -->
        <div class="feature-toggle" title="AI features: off hides every AI prompt and panel">
            <input type="checkbox" id="ai-features-enabled" name="ai-features-enabled">
            <label for="ai-features-enabled">AI</label>
        </div>
    </div>

    <!-- Bottom-left, the corner furthest from the tools: settings are the thing
         you reach for least. -->
    <div class="menu-button" title="Menu: AI, fractal, saves and settings">
        <div class="menu-icon" id="menu-icon"></div>
    </div>

    <div class="dropdown-content">
        <div>
            <div class="tabs">
                <!-- Ai is first, and it is what the menu opens on: the prompt that used
                     to sit under the notes editor is at the top of it now. -->
                <button class="tablink" id="tablink-ai" title="Prompt the AI, change model and keys" onclick="openTab('tab4', this)">Ai</button>
                <button class="tablink" title="Adjust fractal rendering" onclick="openTab('tab2', this)">Fractal</button>
                <button class="tablink" title="Teleport to interesting locations" onclick="openTab('tab6', this)">Saves</button>
                <!-- Second from the end, before help: settings are read less often
                     than any tab that holds content, and more often than help. -->
                <button class="tablink" title="Input, node placement and stored data" onclick="openTab('tab5', this)">Settings</button>
                <button class="tablink" title="help" onclick="openTab('tab3', this)">?</button>
            </div>

            <!-- Tab content placeholders -->

            <!-- No tablink points here any more: the Notes tab is gone. The div and its
                 `PageLoad.tabs` entry stay because the app reads what loads into it and
                 would throw without it -- `App.init` builds `ZetPanes` from
                 `#zetPaneContainer`, and `openTab` refreshes
                 `currentActiveZettelkastenMirror` on every tab switch. It also keeps
                 text-to-graph sync alive: an AI answer with no target node is streamed
                 into that editor, and the sync pass turns it into nodes.

                 So this is invisible, not dead. Issue #65 records the 14 mirror sites and
                 the 18 `zetPaneList` sites, and holds the choice between giving the editor
                 a designed home and deleting it outright. -->
            <div id="tab1" class="tabcontent">
                <!-- Tab 1 content will be loaded here -->
            </div>
            <div id="tab4" class="tabcontent">
                <!-- Tab 4 content will be loaded here -->
            </div>
            <div id="tab2" class="tabcontent">
                <!-- Tab 2 content will be loaded here -->
            </div>
            <div id="tab6" class="tabcontent">
                <!-- Tab 6 content will be loaded here -->
            </div>
            <div id="tab5" class="tabcontent">
                <!-- Tab 5 content will be loaded here -->
            </div>
            <div id="tab3" class="tabcontent">
                <!-- Tab 3 content will be loaded here -->
            </div>

            <!-- The function-calling console, below the tabs rather than inside one.
                 It holds a CodeMirror, and CodeMirror measures itself when it is
                 constructed: a `.tabcontent` is `display: none` until its tab is
                 opened, which would give the editor zero dimensions. The panel is
                 only translated off-screen, so the editor still gets real ones. -->
            <div id="function-call-slot"></div>
        </div>
    </div>
</div>
